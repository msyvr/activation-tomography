[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activation-tomography"
version = "0.0.1"
description = "Activation tomography: an inverse-problem framing for LLM interpretability via natural language autoencoders. Research fork of kitft/natural_language_autoencoders."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "httpx",
    "orjson",
    "pyyaml",
    "numpy",
    "pyarrow",
    "datasets",
    "anthropic",
]
# NOT pip-installable here — install separately per docs/setup.md:
#   miles    : git clone radixark/miles, build_conda.sh, then git apply nla/miles_patches/*.patch
#   sglang   : pip install "sglang[all]>=0.5.6", then bash patches/apply_sglang_patches.sh /path/to/sglang
#   megatron : optional, only for the Megatron backend (70B+)

[project.urls]
Homepage = "https://github.com/msyvr/activation-tomography"
SourceFork = "https://github.com/kitft/natural_language_autoencoders"

[tool.setuptools.packages.find]
include = ["nla*"]

[tool.setuptools.package-data]
nla = ["miles_patches/*", "datagen/*.yaml"]

[tool.ruff]
line-length = 119
